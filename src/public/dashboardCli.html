<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mi Sitio Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/dashboard/dashboardCli/styles.css" />
    <!-- <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'> -->
    
    <script type="module" src="./js/dashboardCli/dashCli-script.js" defer></script>
    <script type="module" src="./js/dashboardCli/components/deplegable_navbar.js" defer></script>
    <script type="module" src="./js/dashboardCli/components/funciones.js" defer></script>
    <script type="module" src="./js/dashboardCli/components/notificaciones.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    
    <!-- <link
    href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
    rel="stylesheet"
    />
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-straight/css/uicons-bold-straight.css'> -->
    
    <div class="contenedor_nab">
      
      <button id="menu-toggle" aria-label="Abrir menú">
        <img src="assets/images/imgDashCli/menu.svg" alt="Menú" width="30" height="30">
      </button>
      
      
      <!-- Menú de navegación -->
      <nav id="main-nav">
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Contáctanos</a></li>
          <li><a href="#">Salida</a></li>
        </ul>
      </nav>
    </div>
    
    
  </head>
  <body>
    <div class="fondo-contenedor">
          <div class="fondo-img"></div>
    <div class="fondo-degradado"></div>
    </div>

    <div class="general">
      <div class="cuadro_estado">
        <div class="search" id="search_prod">
          <input id="busqueda" type="text" 
          placeholder="Porducto a buscar..." 
          onfocus="this.placeholder=''" 
          onblur="if(this.value === '') this.placeholder='Producto a buscar...'" />
          <button class="btn-togle_factura" id="toggleBtn_factura" onclick="despligue_factura()">
            <img src="assets/images/imgDashCli/clipboard-check .svg" alt=""></button>
      </div>
      <div class="resultados" id="resultados"></div>
      <div class="last_order" id="last_order"><h1>Ultimo pedido: </h1></div>
      <div class="list_order">
        <button class="btn-togle" id="toggleBtn" onclick="despligue()">desplegar</button>
        <div class="contendor_last">
          
          <table id="contenido" style="display: none;">
            <thead>
              <tr>
                
              </tr>
            </thead>
            <tbody id="list_order_table"></tbody>
          </table>
        </div>
      </div>
    </div>
      <div class="factura" id="factura" style="display: none;">
        <button class="btn-togle_factura_negative" id="toggleBtn_factura_negative" onclick="despligue_factura_negative()">
          Regresar</button>

      <!-- <p id="pedido_title">Pedidos: </p> -->
      <div class="tablas_" >
        <table>
          <thead>
            <tr>
              <td><p>Producto</p></td>
              <td><p>Cantidad</p></td>
              <td><p>Precio(s/.)</p></td>
            </tr>
          </thead>
          <tbody id="tabla_pedidos"></tbody>
        </table>
      </div>
      <button id="btn-pagar">Pagar</button>

    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>Finalizar pago</h2>
      <div class="opciones-pago">
        <label><input type="radio" name="metodo" value="Yape" checked> Yape</label>
        <label><input type="radio" name="metodo" value="Plin"> Plin</label>
      </div>
      <button id="btn-confirmar">Confirmar pago</button>
    </div>
  </div>
  </body>
</html>
